name: Cập nhật dữ liệu địa điểm

on:
  schedule:
    - cron: "0 22 * * *"   # 05:00 sáng giờ Việt Nam mỗi ngày
  workflow_dispatch:        # cho phép bấm chạy tay

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lấy dữ liệu từ YouTube và Google Places
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: node scripts/refresh-data.mjs
      - name: Lưu nếu có thay đổi
        run: |
          if git diff --quiet -- data/live.json; then
            echo "Không có thay đổi."
          else
            git config user.name "bkk-swipe-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/live.json
            git commit -m "Cập nhật dữ liệu địa điểm"
            git push
          fi
